name: 119 Official Notice Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/official-monitor.yml'
      - 'v9/official-monitor-lib.mjs'
      - 'v9/official-monitor-sync.mjs'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: 119-official-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.repository == 'seungjae3908-source/fire-rescue-study-web' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Collect official NFA/NFSA notices
        id: collect
        continue-on-error: true
        run: >-
          node v9/official-monitor-sync.mjs
          --output /tmp/official-monitor.json
          --health-output /tmp/official-monitor-health.json
          --last-good-output /tmp/official-monitor-last-good.json
      - name: Publish isolated monitor snapshot and health
        if: ${{ always() && steps.collect.outcome != 'cancelled' }}
        env:
          SNAPSHOT_BRANCH: chore/official-monitor-snapshot
        run: |
          set -euo pipefail
          test -s /tmp/official-monitor.json
          test -s /tmp/official-monitor-health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$SNAPSHOT_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SNAPSHOT_BRANCH"
            git switch -C "$SNAPSHOT_BRANCH" "origin/$SNAPSHOT_BRANCH"
          else
            git switch -c "$SNAPSHOT_BRANCH"
          fi
          mkdir -p v9/data
          cp /tmp/official-monitor.json v9/data/official-monitor.json
          cp /tmp/official-monitor-health.json v9/data/official-monitor-health.json
          if [ -s /tmp/official-monitor-last-good.json ]; then
            cp /tmp/official-monitor-last-good.json v9/data/official-monitor-last-good.json
          fi
          git add v9/data/official-monitor.json v9/data/official-monitor-health.json
          if [ -f v9/data/official-monitor-last-good.json ]; then
            git add v9/data/official-monitor-last-good.json
          fi
          if git diff --cached --quiet; then
            echo "OFFICIAL_MONITOR_NO_CHANGE"
          else
            git commit -m "chore(monitor): refresh official notice snapshot"
            git push origin "HEAD:$SNAPSHOT_BRANCH"
          fi
      - name: Fail closed when live official collection is unhealthy
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo "OFFICIAL_MONITOR_LIVE_COLLECTION_UNHEALTHY"
          exit 2
