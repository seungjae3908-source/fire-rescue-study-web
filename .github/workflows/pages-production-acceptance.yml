name: GitHub Pages Production Acceptance

on:
  pull_request:
    paths:
      - 'v9/pages-production-acceptance.mjs'
      - '.github/workflows/pages-production-acceptance.yml'
      - '.github/workflows/pages-deploy.yml'
      - 'v9/pages-live-browser-e2e.mjs'
      - 'v9/suggestions-production-public-e2e.mjs'
  push:
    branches: [main]
    paths:
      - 'v9/**'
      - 'index.html'
      - '.github/workflows/pages-production-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Wait for GitHub Pages exact-main propagation
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if node v9/pages-production-acceptance.mjs; then
              exit 0
            fi
            echo "Pages not exact-main yet; retry $i/30"
            sleep 10
          done
          echo "GitHub Pages did not converge to expected main in time"
          exit 1


      - name: Install live Pages browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Live Pages member-gate and learner UX acceptance
        env:
          STUDY_119_PRODUCTION_URL: https://seungjae3908-source.github.io/fire-rescue-study-web/v9/
          STUDY_119_EXPECTED_RUNTIME_HEAD: ${{ env.BASE_SHA }}
          STUDY_119_RUNTIME_HEAD_URL: https://seungjae3908-source.github.io/fire-rescue-study-web/v9/pages-runtime.json
        run: node v9/pages-live-browser-e2e.mjs

      - name: Live Pages guest suggestion guard acceptance
        env:
          STUDY_119_PREVIEW_URL: https://seungjae3908-source.github.io/fire-rescue-study-web/v9/
          STUDY_119_EXPECTED_RUNTIME_HEAD: ${{ env.BASE_SHA }}
          STUDY_119_RUNTIME_HEAD_URL: https://seungjae3908-source.github.io/fire-rescue-study-web/v9/pages-runtime.json
        run: node v9/suggestions-production-public-e2e.mjs
