name: Deploy AI과외 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify official textbook baseline is still current
        shell: bash
        run: |
          set -euo pipefail
          snapshot="/tmp/official-monitor.json"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://raw.githubusercontent.com/seungjae3908-source/fire-rescue-study-web/chore/official-monitor-snapshot/v9/data/official-monitor.json" \
            -o "$snapshot"
          node v9/official-textbook-change-gate.mjs --snapshot "$snapshot" --max-age-hours 6

      - name: Restore 2026 official PDF mirror cache
        uses: actions/cache@v4
        with:
          path: official-pdf-mirror
          key: study119-official-pdf-${{ hashFiles('v9/data/official-textbook-baseline.json') }}

      - name: Materialize all ten official PDF mirrors directly from NFA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-pdf-mirror
          docs=(fire1 fire2 ems prevention1 prevention2 law1 law2 law3 law4 law5)
          for doc in "${docs[@]}"; do
            out="official-pdf-mirror/${doc}.pdf"
            if [[ -s "$out" ]] && [[ "$(head -c 5 "$out" 2>/dev/null || true)" == '%PDF-' ]]; then
              echo "MIRROR_CACHE_HIT $doc $(wc -c < "$out" | tr -d ' ')"
              continue
            fi
            meta="/tmp/${doc}-materialize.json"
            node v9/official-pdf-materialize-resolve.mjs "$doc" "$meta"
            referer="$(jq -r '.detailUrl' "$meta")"
            cookie="$(jq -r '.cookie' "$meta")"
            ok=0
            while IFS= read -r url; do
              tmp="${out}.tmp"
              rm -f "$tmp"
              args=(-fsSL --retry 4 --retry-delay 2 --retry-all-errors --connect-timeout 20 --max-time 240
                -A 'Mozilla/5.0 (compatible; 119Study/1.0)'
                -H 'Accept: application/pdf,*/*;q=0.8'
                -H 'Cache-Control: no-cache'
                -e "$referer")
              if [[ -n "$cookie" ]]; then args+=(-H "Cookie: $cookie"); fi
              if curl "${args[@]}" "$url" -o "$tmp"; then
                magic="$(head -c 5 "$tmp" 2>/dev/null || true)"
                bytes="$(wc -c < "$tmp" | tr -d ' ')"
                if [[ "$magic" == "%PDF-" && "$bytes" -gt 100000 ]]; then
                  mv "$tmp" "$out"
                  ok=1
                  break
                fi
              fi
              rm -f "$tmp"
            done < <(jq -r '.urls[]' "$meta")
            test "$ok" = "1"
            echo "MIRROR_FETCH_DONE $doc $(wc -c < "$out" | tr -d ' ')"
          done
          (
            cd official-pdf-mirror
            sha256sum fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SHA256SUMS.txt
            wc -c fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SIZES.txt
            sha256sum -c SHA256SUMS.txt
          )
          baseline_sha="$(sha256sum v9/data/official-textbook-baseline.json | awk '{print $1}')"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > official-pdf-mirror/MANIFEST.json <<EOF
          {
            "version": "119-official-pdf-mirror-manifest-v1",
            "generatedAt": "$generated_at",
            "baselineSha256": "$baseline_sha",
            "docs": ["fire1","fire2","ems","prevention1","prevention2","law1","law2","law3","law4","law5"]
          }
          EOF
          touch official-pdf-mirror/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
