name: Deploy AI과외 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Verify official textbook baseline is still current
        shell: bash
        run: |
          set -euo pipefail
          bash v9/official-textbook-freshness-check.sh

      - name: Restore 2026 official PDF mirror cache
        uses: actions/cache@v4
        with:
          path: official-pdf-mirror
          key: study119-official-pdf-${{ hashFiles('v9/data/official-textbook-baseline.json', 'v9/materialize-official-pdfs.sh', 'v9/official-pdf-materialize-resolve.mjs', 'v9/api/official-pdf.js') }}

      - name: Materialize all ten official PDF mirrors directly from NFA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-pdf-mirror
          bash v9/materialize-official-pdfs.sh official-pdf-mirror fire1 fire2 ems prevention1 prevention2 law1 law2 law3 law4 law5
          (
            cd official-pdf-mirror
            sha256sum fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SHA256SUMS.txt
            wc -c fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SIZES.txt
            sha256sum -c SHA256SUMS.txt
          )
          baseline_sha="$(sha256sum v9/data/official-textbook-baseline.json | awk '{print $1}')"
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > official-pdf-mirror/MANIFEST.json <<EOF
          {
            "version": "119-official-pdf-mirror-manifest-v1",
            "generatedAt": "$generated_at",
            "baselineSha256": "$baseline_sha",
            "docs": ["fire1","fire2","ems","prevention1","prevention2","law1","law2","law3","law4","law5"]
          }
          EOF
          touch official-pdf-mirror/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
