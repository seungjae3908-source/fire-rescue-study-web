name: Deploy AI과외 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Restore 2026 official PDF mirror cache
        uses: actions/cache@v4
        with:
          path: official-pdf-mirror
          key: study119-official-pdf-2026-v2
          restore-keys: |
            study119-official-pdf-2026-

      - name: Materialize all ten official static PDF mirrors
        shell: bash
        run: |
          set -euo pipefail
          node v9/materialize-official-pdf-mirrors.mjs official-pdf-mirror
          (
            cd official-pdf-mirror
            sha256sum fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SHA256SUMS.txt
            wc -c fire1.pdf fire2.pdf ems.pdf prevention1.pdf prevention2.pdf law1.pdf law2.pdf law3.pdf law4.pdf law5.pdf > SIZES.txt
          )
          touch official-pdf-mirror/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
