name: Production Current-Main Acceptance

on:
  workflow_run:
    workflows: ["V9 Development CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Exact main SHA that Production must serve'
        required: true
        type: string

concurrency:
  group: production-current-main-acceptance
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production_current_main_acceptance:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.expected_head != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_119_PRODUCTION_URL: https://fire-rescue-study-web.vercel.app/
      STUDY_119_EXPECTED_RUNTIME_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_head }}
    steps:
      - name: Validate expected SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$STUDY_119_EXPECTED_RUNTIME_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "INVALID_EXPECTED_HEAD"
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.STUDY_119_EXPECTED_RUNTIME_HEAD }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Wait for exact SHA to become Production
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${STUDY_119_PRODUCTION_URL%/}/api/runtime-head"
          for attempt in $(seq 1 90); do
            body="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "$endpoint" 2>/dev/null || true)"
            if [[ "$body" == *"\"sha\":\"$STUDY_119_EXPECTED_RUNTIME_HEAD\""* && "$body" == *"\"environment\":\"production\""* ]]; then
              echo "PRODUCTION_EXACT_HEAD_READY $STUDY_119_EXPECTED_RUNTIME_HEAD"
              exit 0
            fi
            sleep 10
          done
          echo "PRODUCTION_EXACT_HEAD_TIMEOUT $STUDY_119_EXPECTED_RUNTIME_HEAD"
          exit 1

      - name: Install Production browser QA
        run: |
          npm install --no-save playwright@1.55.0 pdfjs-dist@5.4.149 tesseract.js@7.0.0
          npx playwright install --with-deps chromium

      - name: Production exact-main mobile + desktop learner acceptance
        env:
          STUDY_119_PREVIEW_URL: ${{ env.STUDY_119_PRODUCTION_URL }}
          STUDY_119_EXPECTED_RUNTIME_HEAD: ${{ env.STUDY_119_EXPECTED_RUNTIME_HEAD }}
        run: node v9/live-student-ux-smoke.mjs

      - name: Production V66 real-interaction scroll acceptance
        env:
          STUDY_119_V66_URL: ${{ env.STUDY_119_PRODUCTION_URL }}
        run: node v9/v66-real-interaction-scroll-e2e.mjs

      - name: Production V67 whole-app real UX acceptance
        env:
          STUDY_119_V67_URL: ${{ env.STUDY_119_PRODUCTION_URL }}
        run: node v9/v67-whole-app-real-ux-e2e.mjs

      - name: Production suggestion guest + anon Data API acceptance
        env:
          STUDY_119_PREVIEW_URL: ${{ env.STUDY_119_PRODUCTION_URL }}
          STUDY_119_EXPECTED_RUNTIME_HEAD: ${{ env.STUDY_119_EXPECTED_RUNTIME_HEAD }}
        run: node v9/suggestions-production-public-e2e.mjs
