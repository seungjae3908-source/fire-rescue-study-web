name: V70 Full Runtime Audit

on:
  pull_request:
    paths:
      - 'v9/**'
      - '.github/workflows/v70-full-runtime-audit.yml'
  workflow_dispatch:

concurrency:
  group: v70-full-runtime-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full_runtime_audit:
    name: scroll PDF original-source full audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Restore Playwright Chromium cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: study119-playwright-chromium-${{ runner.os }}-1.55.0

      - name: Restore ten-PDF audit cache
        uses: actions/cache@v4
        with:
          path: official-pdf-mirror
          key: study119-v70-runtime-pdf-${{ runner.os }}-${{ hashFiles('v9/data/official-textbook-baseline.json', 'v9/materialize-official-pdfs.sh', 'v9/official-pdf-materialize-resolve.mjs') }}
      - name: Install browser audit dependencies
        run: |
          npm install --no-save playwright@1.55.0 pdfjs-dist@5.4.149 tesseract.js@7.0.0
          npx playwright install-deps chromium
          if [[ ! -x "$HOME/.cache/ms-playwright/chromium_headless_shell-1187/chrome-linux/headless_shell" && ! -d "$HOME/.cache/ms-playwright/chromium-1187" ]]; then
            npx playwright install chromium
          else
            echo "PLAYWRIGHT_BROWSER_CACHE_HIT"
          fi
      - name: Materialize ten-PDF audit mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official-pdf-mirror
          base="https://seungjae3908-source.github.io/fire-rescue-study-web/official-pdf-mirror"
          for doc in prevention1 prevention2 law1 law2 law3 law4 law5; do
            curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$base/$doc.pdf" -o "official-pdf-mirror/$doc.pdf"
          done
          bash v9/materialize-official-pdfs.sh official-pdf-mirror fire1 fire2 ems
          for doc in fire1 fire2 ems prevention1 prevention2 law1 law2 law3 law4 law5; do
            test "$(head -c 5 "official-pdf-mirror/$doc.pdf")" = "%PDF-"
            test "$(wc -c < "official-pdf-mirror/$doc.pdf" | tr -d ' ')" -gt 100000
          done

      - name: Start branch-only static runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/study119-v70-full-http.log 2>&1 &
          echo $! > /tmp/study119-v70-full-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/v9/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/study119-v70-full-http.log
          exit 1
      - name: Full mobile tablet desktop scroll PDF original-source audit
        env:
          STUDY_119_V70_AUDIT_URL: http://127.0.0.1:4173/v9/index.html
        run: node v9/v70-full-runtime-audit-e2e.mjs
