name: V75 User Review Preview

on:
  push:
    branches:
      - audit/v75-user-review-6eac4b29
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_MxtfVu3qGUWu6b5r7MR79pJk
      VERCEL_PROJECT_ID: prj_UqxuscM3o0pBJtJIPTjH2NnlRMpq
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Require preview deployment credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
      - name: Install Vercel CLI
        run: npm install --global vercel
      - name: Link isolated preview project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull Preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Deploy Preview only
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "V75_USER_REVIEW_PREVIEW_URL=$url"
      - name: Assert non-production deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.deploy.outputs.url }}"
          echo "Preview only; no --prod flag used."
