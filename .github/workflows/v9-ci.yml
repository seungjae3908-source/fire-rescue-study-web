name: V9 Development CI

on:
  push:
    branches: [feat/v9-learning-workspace]
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'
      - '.github/workflows/v9-ci.yml'
  pull_request:
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in v9/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          node --check v9/api/official-pdf.js
      - name: Static integrity / privacy / source truth
        run: node v9/ci-static.mjs
      - name: 176-concept + 119 textbook/content contract depth gate
        run: node v9/content-depth.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start branch-only static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitutor-v9-http.log 2>&1 &
          echo $! > /tmp/aitutor-v9-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/v9/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitutor-v9-http.log
          exit 1
      - name: PC/tablet/mobile 119 textbook + evidence flow QA
        run: node v9/e2e.mjs
      - name: Inspect official PDF attachment metadata in Chromium
        continue-on-error: true
        run: node v9/source-catalog-browser.mjs
      - name: Personal PDF extraction and owner isolation QA
        run: node v9/pdf-e2e.mjs
      - name: Member merge and extracted-text sync isolation QA
        run: node v9/sync-e2e.mjs


  official_pdf_proxy_contract:
    name: official_pdf_proxy_contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic NFA attachment candidate selection
        run: node v9/official-pdf-proxy-test.mjs

  source_browser_diagnostic:
    name: source_browser_diagnostic (non-release proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source browser probe dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Resolve official NFA PDF paths in Chromium
        run: node v9/source-catalog-browser.mjs
