name: V9 Development CI

on:
  push:
    branches: [feat/v9-learning-workspace]
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'
      - '.github/workflows/v9-ci.yml'
  pull_request:
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in v9/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          node --check v9/api/official-pdf.js
      - name: Static integrity / privacy / source truth
        run: node v9/ci-static.mjs
      - name: 176-concept + 119 textbook/content contract depth gate
        run: node v9/content-depth.mjs
      - name: 119 content contract blocker report
        run: node v9/content-contract-audit.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start branch-only static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitutor-v9-http.log 2>&1 &
          echo $! > /tmp/aitutor-v9-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/v9/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitutor-v9-http.log
          exit 1
      - name: PC/tablet/mobile 119 textbook + evidence flow QA
        run: node v9/e2e.mjs
      - name: Personal PDF extraction and owner isolation QA
        run: node v9/pdf-e2e.mjs
      - name: Member merge and extracted-text sync isolation QA
        run: node v9/sync-e2e.mjs


  official_pdf_proxy_contract:
    name: official_pdf_proxy_contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic NFA attachment candidate selection
        run: node v9/official-pdf-proxy-test.mjs

  source_browser_diagnostic:
    name: source_browser_diagnostic (non-release proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source browser probe dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Resolve official NFA PDF paths in Chromium
        run: node v9/source-catalog-browser.mjs

  live_preview_acceptance:
    if: "${{ contains(github.event.head_commit.message, 'live preview acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
      STUDY_119_PROXY_RUNTIME_HEAD: f7c1b971966e5cae90d4009c8257af1b79144128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install live browser QA dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real deployed 119 preview official-PDF acceptance
        run: node v9/live-preview-e2e.mjs

  page_anchor_discovery:
    if: "${{ contains(github.event.head_commit.message, 'page anchor discovery') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
      STUDY_119_DISCOVERY_IDS: F07-C01,F07-C02,F07-C03,F07-C04,F07-C06,F07-C07,F07-C08,F07-C09,F07-C10,F07-C11,F07-C12,F07-C13,F07-C14,F07-C15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install page-anchor discovery browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Discover official PDF page anchors with source text
        run: node v9/page-anchor-discovery.mjs

  sprinkler_live_acceptance:
    if: "${{ contains(github.event.head_commit.message, 'sprinkler live acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install focused sprinkler browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify six deployed sprinkler exact-page anchors
        run: node v9/sprinkler-live-e2e.mjs

  page_range_inspect:
    if: "${{ contains(github.event.head_commit.message, 'page range inspect') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
      STUDY_119_INSPECT_ID: F05-C08
      STUDY_119_INSPECT_PAGES: 530,531,532,533,534,535,536,537,538,539,540,541,542,543,544
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF range inspector browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect exact official PDF page range
        run: node v9/page-range-inspect.mjs

  fire_phenomena_live_acceptance:
    if: "${{ contains(github.event.head_commit.message, 'fire phenomena live acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
      STUDY_119_PROXY_RUNTIME_HEAD: e8c29ba9f750b03259b643fa1dfd664c75140fbf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install fire-phenomena browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify eight deployed fire-phenomena exact-page anchors
        run: node v9/fire-phenomena-live-e2e.mjs

  hazmat_live_acceptance:
    if: "${{ contains(github.event.head_commit.message, 'hazmat live acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hazardous-material browser QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify eight deployed hazardous-material exact-page anchors
        run: node v9/hazmat-live-e2e.mjs

  cross_doc_fire_investigation:
    if: "${{ contains(github.event.head_commit.message, 'cross doc fire investigation') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 68ea44b416f3e5604770d84f462fb1184bd1beaf
      STUDY_119_CROSS_DOCS: fire2,prevention2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cross-document source probe
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Find fire-investigation source document and pages
        run: node v9/cross-doc-fire-investigation.mjs
