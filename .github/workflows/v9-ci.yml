name: V9 Development CI

on:
  push:
    branches: [feat/v9-learning-workspace]
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'
      - '.github/workflows/v9-ci.yml'
  pull_request:
    paths:
      - 'v9/**'
      - 'supabase/v9-schema.sql'
      - 'supabase/v9-owner-hardening.sql'
      - 'supabase/v9-live-backend-hardening.sql'
      - 'supabase/v9-shared-auth-routing.sql'
      - 'supabase/v9-study-membership-trigger.sql'
      - 'supabase/tests/v9-live-closed-loop.sql'
      - 'V9-ARCHITECTURE.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for f in v9/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
          node --check v9/api/official-pdf.js
      - name: Static integrity / privacy / source truth
        run: node v9/ci-static.mjs
      - name: 176-concept + 119 textbook/content contract depth gate
        run: node v9/content-depth.mjs
      - name: 119 content contract blocker report
        run: node v9/content-contract-audit.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start branch-only static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/aitutor-v9-http.log 2>&1 &
          echo $! > /tmp/aitutor-v9-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/v9/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aitutor-v9-http.log
          exit 1
      - name: PC/tablet/mobile 119 textbook + evidence flow QA
        run: node v9/e2e.mjs
      - name: Personal PDF extraction and owner isolation QA
        run: node v9/pdf-e2e.mjs
      - name: Member merge and extracted-text sync isolation QA
        run: node v9/sync-e2e.mjs


  official_pdf_proxy_contract:
    name: official_pdf_proxy_contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic NFA attachment candidate selection
        run: node v9/official-pdf-proxy-test.mjs

  source_browser_diagnostic:
    name: source_browser_diagnostic (non-release proof)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source browser probe dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Resolve official NFA PDF paths in Chromium
        run: node v9/source-catalog-browser.mjs

  live_preview_acceptance:
    if: "${{ contains(github.event.head_commit.message, 'live preview acceptance') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: 88fd5530a785d9fb9c297a029622a6de19b6abec
      STUDY_119_PROXY_RUNTIME_HEAD: f7c1b971966e5cae90d4009c8257af1b79144128
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install live browser QA dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Real deployed 119 preview official-PDF acceptance
        run: node v9/live-preview-e2e.mjs

  page_anchor_discovery:
    if: "${{ contains(github.event.head_commit.message, 'page anchor discovery') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STUDY_119_PREVIEW_URL: https://study-119-preview.vercel.app/
      STUDY_119_EXPECTED_APP_HEAD: aa8e11269cba310c1812dc577be3ac109c135d76
      STUDY_119_DISCOVERY_IDS: F05-C01,F05-C08,F07-C05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install page-anchor discovery browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Discover official PDF page anchors with source text
        run: node v9/page-anchor-discovery.mjs
